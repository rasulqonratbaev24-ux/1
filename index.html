<!DOCTYPE html>
<html>
<head>
<title>Jeopardy FIXED</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #111;
  color: white;
}

table {
  margin: auto;
  border-collapse: collapse;
}

th, td {
  width: 160px;
  height: 120px;
  border: 2px solid white;
  cursor: pointer;
}

th { background: darkred; }
td { background: blue; }

.option {
  margin: 20px;
  padding: 24px;
  background: #333;
  color: white;
  border: 2px solid white;
  cursor: pointer;
}

.option:hover {
  background: #555;
}

/* ✅ MUHIM FIX */
.modal {
  position: fixed;
  top: 20%;
  left: 50%;
  transform: translateX(-50%);
  width: 60%;
  background: #222;
  color: white;
  padding: 20px;
  border: 3px solid white;
  z-index: 999;
}

#win {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  color: gold;
  font-size: 60px;
  padding-top: 240px;
}
</style>
</head>

<body>

<h1>🎮 Jeopardy</h1>

<div>
P1:<span id="p1">0</span> |
P2:<span id="p2">0</span> |
P3:<span id="p3">0</span> |
P4:<span id="p4">0</span>
</div>

<table id="board"></table>
<div id="win"></div>

<script>

let scores=[0,0,0,0],current=0,used=0;
let currentBox=null;

const categories=["Math","Tarix","Geo","English","Sport"];
const points=[100,200,300,400,500,600,700,800];

// ❗ minimal savol (test uchun)
const questions = [
[
{q:"2+2?",o:["3","4","5","6"],a:1},
{q:"5×5?",o:["20","25","30","15"],a:1},
{q:"10-3?",o:["6","7","8","9"],a:1},
{q:"12/4?",o:["2","3","4","6"],a:1},
{q:"9+1?",o:["10","11","12","13"],a:0},
{q:"6+6?",o:["10","12","14","16"],a:1},
{q:"8×2?",o:["14","16","18","20"],a:1},
{q:"20/5?",o:["2","3","4","5"],a:2}
],
[
{q:"Poytaxt?",o:["Toshkent","Buxoro","Xiva","Nukus"],a:0},
{q:"1991?",o:["Mustaqillik","Urush","Inqilob","Davlat"],a:0},
{q:"Temur?",o:["Sarkarda","Shoir","Olim","Artist"],a:0},
{q:"Karimov?",o:["Prezident","Sportchi","Olim","Aktyor"],a:0},
{q:"1945?",o:["Urush tugadi","Boshlanish","Davlat","Tinchlik"],a:0},
{q:"Bayroq?",o:["Ko'k","Qizil","Sariq","Qora"],a:0},
{q:"O'zbekiston?",o:["Davlat","Shahar","Daryo","Tog"],a:0},
{q:"Temur tug‘ilgan?",o:["Shahrisabz","Xiva","Nukus","Farg'ona"],a:0}
],
[
{q:"Eng katta okean?",o:["Tinch","Atlantika","Hind","Shimoliy"],a:0},
{q:"Qit'a?",o:["7","5","6","8"],a:0},
{q:"Nil?",o:["Daryo","Ko'l","Tog","Shahar"],a:0},
{q:"Yer?",o:["Planeta","Yulduz","Oy","Quyosh"],a:0},
{q:"Sovuq?",o:["Antarktida","Afrika","Osiyo","Yevropa"],a:0},
{q:"Dunyo?",o:["Planeta","Yulduz","Oy","Quyosh"],a:0},
{q:"Qit'a soni?",o:["7","6","5","4"],a:0},
{q:"Daryo?",o:["Nil","Amu","Sirdaryo","Volga"],a:0}
],
[
{q:"Hello?",o:["Salom","Xayr","Rahmat","Uzr"],a:0},
{q:"Book?",o:["Kitob","Qalam","Stol","Telefon"],a:0},
{q:"Apple?",o:["Olma","Banan","Uzum","Anor"],a:0},
{q:"Go past?",o:["Went","Go","Gone","Going"],a:0},
{q:"Dog?",o:["It","Mushuk","Ot","Qush"],a:0},
{q:"Water?",o:["Suv","Olov","Havo","Tuproq"],a:0},
{q:"Sun?",o:["Quyosh","Oy","Yulduz","Yer"],a:0},
{q:"Ice?",o:["Muz","Suv","Tosh","Olov"],a:0}
],
[
{q:"Futbol?",o:["11","10","9","12"],a:0},
{q:"Messi?",o:["Argentina","Braziliya","Fransiya","Italiya"],a:0},
{q:"Ronaldo?",o:["Portugal","Ispaniya","Germaniya","Fransiya"],a:0},
{q:"NBA?",o:["Basketbol","Futbol","Tennis","Hokkey"],a:0},
{q:"Olimpiada?",o:["4 yil","2 yil","1 yil","5 yil"],a:0},
{q:"Gepard?",o:["Tez","Sekin","Og'ir","Kichik"],a:0},
{q:"Sport?",o:["Harakat","Uyqu","Ovqat","Kitob"],a:0},
{q:"O'yin?",o:["Fun","Work","Sleep","Eat"],a:0}
]
];

function createBoard(){
let t=document.getElementById("board");

let h="<tr>";
categories.forEach(c=>h+="<th>"+c+"</th>");
h+="</tr>";
t.innerHTML+=h;

for(let i=0;i<8;i++){
let r="<tr>";
for(let j=0;j<5;j++){
r+=`<td onclick="openQ(${j},${i},this)">${points[i]}</td>`;
}
r+="</tr>";
t.innerHTML+=r;
}
}

function openQ(cat,idx,cell){

let q=questions[cat][idx];

let box=document.createElement("div");
box.className="modal";
currentBox=box;

box.innerHTML="<h2>"+q.q+"</h2>";

q.o.forEach((opt,i)=>{
let btn=document.createElement("div");
btn.className="option";
btn.innerText=opt;

btn.onclick=()=>{
if(i===q.a){scores[current]+=points[idx];}
else{scores[current]-=points[idx];}

current=(current+1)%4;
update();

cell.style.background="gray";
cell.onclick=null;

document.body.removeChild(box);
};

box.appendChild(btn);
});

document.body.appendChild(box);
}

function update(){
p1.innerText=scores[0];
p2.innerText=scores[1];
p3.innerText=scores[2];
p4.innerText=scores[3];
}

createBoard();
update();

</script>
</body>
</html>
