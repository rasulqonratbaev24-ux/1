<!DOCTYPE html>
<html>
<head>
<title>Jeopardy Real</title>
<style>
body{font-family:Arial;text-align:center;background:#111;color:white;}
table{margin:auto;border-collapse:collapse;}
th,td{width:120px;height:60px;border:2px solid white;cursor:pointer;}
th{background:darkred;} td{background:blue;}
.option{margin:8px;padding:10px;background:#222;border:1px solid white;cursor:pointer;}
#win{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:black;color:gold;font-size:40px;padding-top:200px;}
</style>
</head>

<body>

<h1>🎮 Jeopardy</h1>

<div>
P1:<span id="p1">0</span> |
P2:<span id="p2">0</span> |
P3:<span id="p3">0</span> |
P4:<span id="p4">0</span>
</div>

<div style="width:300px;margin:auto;background:#333;height:20px;">
<div id="bar" style="height:100%;width:100%;background:lime;"></div>
</div>
<h3>⏱ <span id="timer">40</span></h3>

<table id="board"></table>
<div id="win"></div>

<script>

let scores=[0,0,0,0],current=0,used=0;
let time=40,interval=null,currentBox=null;
let prizeCells=[];

const categories=["Math","Tarix","Geo","English","Sport"];
const points=[100,200,300,400,500,600,700,800];

// 🎯 HAQIQIY 40 TA SAVOL
const questions = [
[
{q:"2+2?",o:["3","4","5","6"],a:1},
{q:"5×6?",o:["30","25","20","35"],a:0},
{q:"10-4?",o:["5","6","7","8"],a:1},
{q:"12/3?",o:["3","4","5","6"],a:1},
{q:"9+8?",o:["16","17","18","19"],a:1},
{q:"7×7?",o:["49","42","36","56"],a:0},
{q:"15-5?",o:["5","10","15","20"],a:1},
{q:"20/4?",o:["4","5","6","7"],a:1}
],
[
{q:"O'zbekiston mustaqilligi?",o:["1990","1991","1992","1993"],a:1},
{q:"Amir Temur?",o:["Shoir","Sarkarda","Olim","Artist"],a:1},
{q:"1945?",o:["Urush tugadi","Boshlanish","Inqilob","Davlat"],a:0},
{q:"Karimov?",o:["Prezident","Sportchi","Olim","Aktyor"],a:0},
{q:"Poytaxt?",o:["Toshkent","Buxoro","Xiva","Andijon"],a:0},
{q:"Temur tug‘ilgan?",o:["Shahrisabz","Xiva","Farg'ona","Nukus"],a:0},
{q:"Bayroq rang?",o:["Ko'k","Qizil","Sariq","Qora"],a:0},
{q:"O'zbekiston?",o:["Davlat","Shahar","Daryo","Tog"],a:0}
],
[
{q:"Eng katta okean?",o:["Tinch","Atlantika","Hind","Shimoliy"],a:0},
{q:"Eng katta qit'a?",o:["Osiyo","Afrika","Yevropa","Avstraliya"],a:0},
{q:"Nil nima?",o:["Daryo","Tog","Ko'l","Shahar"],a:0},
{q:"Yer shakli?",o:["Dumaloq","Kvadrat","Tekis","Uchburchak"],a:0},
{q:"Sovuq materik?",o:["Antarktida","Afrika","Osiyo","Yevropa"],a:0},
{q:"Qit'a soni?",o:["5","6","7","8"],a:2},
{q:"Yer nima?",o:["Planeta","Yulduz","Oy","Quyosh"],a:0},
{q:"Eng uzun daryo?",o:["Nil","Amazon","Amu","Volga"],a:0}
],
[
{q:"Hello?",o:["Salom","Xayr","Rahmat","Uzr"],a:0},
{q:"Book?",o:["Kitob","Qalam","Stol","Telefon"],a:0},
{q:"Apple?",o:["Olma","Banan","Uzum","Anor"],a:0},
{q:"Go past?",o:["Went","Go","Gone","Going"],a:0},
{q:"Dog?",o:["It","Mushuk","Ot","Qush"],a:0},
{q:"Water?",o:["Suv","Olov","Havo","Tuproq"],a:0},
{q:"Sun?",o:["Quyosh","Oy","Yulduz","Yer"],a:0},
{q:"Ice?",o:["Muz","Suv","Tosh","Olov"],a:0}
],
[
{q:"Futbolchilar?",o:["11","10","9","12"],a:0},
{q:"Messi?",o:["Argentina","Braziliya","Fransiya","Italiya"],a:0},
{q:"Ronaldo?",o:["Portugal","Ispaniya","Germaniya","Fransiya"],a:0},
{q:"NBA?",o:["Basketbol","Futbol","Tennis","Hokkey"],a:0},
{q:"Olimpiada?",o:["4 yil","2 yil","1 yil","5 yil"],a:0},
{q:"Gepard?",o:["Eng tez","Sekin","Og'ir","Kichik"],a:0},
{q:"Sport?",o:["Harakat","Uyqu","Ovqat","Kitob"],a:0},
{q:"O'yin?",o:["Fun","Work","Sleep","Eat"],a:0}
]
];

function createBoard(){
let t=document.getElementById("board");
let h="<tr>";
categories.forEach(c=>h+="<th>"+c+"</th>");
h+="</tr>"; t.innerHTML+=h;

while(prizeCells.length<4){
let r=Math.floor(Math.random()*40);
if(!prizeCells.includes(r)) prizeCells.push(r);
}

for(let i=0;i<8;i++){
let r="<tr>";
for(let j=0;j<5;j++){
let index=i*5+j;
r+=`<td onclick="openQ(${j},${i},this,${index})">${points[i]}</td>`;
}
r+="</tr>"; t.innerHTML+=r;
}
}

function startTimer(idx){
clearInterval(interval);
time=40;
let t=document.getElementById("timer");
let bar=document.getElementById("bar");

interval=setInterval(()=>{
time--; t.innerText=time;
bar.style.width=(time/40*100)+"%";

if(time<=0){
clearInterval(interval);
scores[current]-=points[idx];
current=(current+1)%4;
update();
if(currentBox) document.body.removeChild(currentBox);
used++; if(used===40) showWinner();
}
},1000);
}

function openQ(cat,idx,cell,index){

if(prizeCells.includes(index)){
let bonus=points[idx]*2;
alert("🎁 BONUS! +" + bonus);
scores[current]+=bonus;
current=(current+1)%4;
update();
cell.style.background="gold";
cell.innerText="🎁";
cell.onclick=null;
used++; if(used===40) showWinner();
return;
}

let q=questions[cat][idx];
let box=document.createElement("div");
currentBox=box;

box.style="position:fixed;top:20%;left:30%;width:40%;background:#222;padding:20px;border:2px solid white;";
box.innerHTML=`<h3>${q.q}</h3>`;

q.o.forEach((opt,i)=>{
let btn=document.createElement("div");
btn.className="option";
btn.innerText=String.fromCharCode(65+i)+") "+opt;

btn.onclick=()=>{
clearInterval(interval);
if(i===q.a){scores[current]+=points[idx];}
else{scores[current]-=points[idx];}
current=(current+1)%4;
update();
cell.style.background="gray";
cell.onclick=null;
document.body.removeChild(box);
used++; if(used===40) showWinner();
};
box.appendChild(btn);
});

document.body.appendChild(box);
startTimer(idx);
}

function update(){
p1.innerText=scores[0];
p2.innerText=scores[1];
p3.innerText=scores[2];
p4.innerText=scores[3];
}

function showWinner(){
let max=Math.max(...scores);
let w=scores.indexOf(max)+1;
win.style.display="block";
win.innerHTML="🏆 WINNER PLAYER "+w+"<br>Score: "+max;
}

createBoard();
update();

</script>
</body>
</html>
