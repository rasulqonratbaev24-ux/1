<!DOCTYPE html>
<html>
<head>
  <title>Jeopardy 8x5</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #111;
      color: white;
    }

    table {
      margin: auto;
      border-collapse: collapse;
    }

    th, td {
      width: 110px;
      height: 70px;
      border: 2px solid white;
      cursor: pointer;
      text-align: center;
      font-size: 16px;
    }

    th { background: darkred; }
    td { background: blue; }
    td:hover { background: darkblue; }

    .scoreboard {
      margin: 15px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<h1>🎮 Jeopardy 8 Kategoriya</h1>

<div class="scoreboard">
  🟢 P1: <span id="p1">0</span> |
  🔵 P2: <span id="p2">0</span> |
  🟡 P3: <span id="p3">0</span> |
  🔴 P4: <span id="p4">0</span>
</div>

<table id="board"></table>

<script>

let scores = [0,0,0,0];
let currentPlayer = 0;

const categories = [
  "Math","Tarix","Geo","Ingliz",
  "Sport","IT","Fan","Umumiy"
];

// 8 × 5 savol
const questions = [
  [
    {q:"2+2?",a:"4"},
    {q:"5×5?",a:"25"},
    {q:"10-3?",a:"7"},
    {q:"12/4?",a:"3"},
    {q:"9+1?",a:"10"}
  ],
  [
    {q:"1991 yil?",a:"mustaqillik"},
    {q:"Amir Temur?",a:"sarkarda"},
    {q:"1945?",a:"urush"},
    {q:"Prezident?",a:"karimov"},
    {q:"Toshkent nima?",a:"poytaxt"}
  ],
  [
    {q:"Eng katta okean?",a:"tinch"},
    {q:"Eng katta qit'a?",a:"osiyo"},
    {q:"Eng uzun daryo?",a:"nil"},
    {q:"Eng sovuq?",a:"antarktida"},
    {q:"Qit'a soni?",a:"7"}
  ],
  [
    {q:"Hello?",a:"salom"},
    {q:"Book?",a:"kitob"},
    {q:"Apple?",a:"olma"},
    {q:"Go past tense?",a:"went"},
    {q:"I am?",a:"menman"}
  ],
  [
    {q:"Futbolchilar?",a:"11"},
    {q:"Messi?",a:"futbolchi"},
    {q:"NBA?",a:"basketbol"},
    {q:"Olimpiada?",a:"4"},
    {q:"Ronaldo?",a:"portugal"}
  ],
  [
    {q:"CPU?",a:"protsessor"},
    {q:"AI?",a:"suniy intellekt"},
    {q:"Internet?",a:"tarmoq"},
    {q:"App?",a:"ilova"},
    {q:"Google?",a:"qidiruv"}
  ],
  [
    {q:"Suv?",a:"h2o"},
    {q:"Yer kuchi?",a:"gravitatsiya"},
    {q:"Quyosh?",a:"yulduz"},
    {q:"Elektr?",a:"tok"},
    {q:"Suyaklar?",a:"206"}
  ],
  [
    {q:"Eng tez hayvon?",a:"gepard"},
    {q:"Valyuta?",a:"dollar"},
    {q:"Planet?",a:"yupiter"},
    {q:"Hafta?",a:"7"},
    {q:"Uzbek pul?",a:"so'm"}
  ]
];

const points = [100,200,300,400,500];

// 📌 jadval
function createBoard(){
  let table = document.getElementById("board");

  let header = "<tr>";
  for(let c of categories){
    header += "<th>"+c+"</th>";
  }
  header += "</tr>";
  table.innerHTML += header;

  for(let i=0;i<5;i++){
    let row = "<tr>";
    for(let j=0;j<8;j++){
      row += `<td onclick="ask(${j},${i},this)">${points[i]}</td>`;
    }
    row += "</tr>";
    table.innerHTML += row;
  }
}

// 📌 savol
function ask(cat, idx, cell){
  let user = prompt("Player " + (currentPlayer+1) + ": " + questions[cat][idx].q);

  if(user && user.toLowerCase() == questions[cat][idx].a){
    alert("To'g'ri!");
    scores[currentPlayer] += points[idx];
  } else {
    alert("Noto'g'ri! - " + points[idx]);
    scores[currentPlayer] -= points[idx]; // ❌ minus ball
  }

  cell.style.background = "gray";
  cell.onclick = null;

  currentPlayer = (currentPlayer + 1) % 4;

  updateScores();
}

function updateScores(){
  document.getElementById("p1").innerText = scores[0];
  document.getElementById("p2").innerText = scores[1];
  document.getElementById("p3").innerText = scores[2];
  document.getElementById("p4").innerText = scores[3];
}

createBoard();
updateScores();

</script>

</body>
</html>
