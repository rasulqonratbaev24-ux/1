<!DOCTYPE html>
<html>
<head>
  <title>Jeopardy Final</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #111;
      color: white;
    }

    table {
      margin: auto;
      border-collapse: collapse;
    }

    th, td {
      width: 180px;
      height: 120px;
      border: 2px solid white;
      cursor: pointer;
    }

    th { background: darkred; }
    td { background: blue; }
    td:hover { background: darkblue; }

    .score {
      margin: 10px;
      font-size: 18px;
    }

    /* 🏆 WIN SCREEN */
    #winScreen {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: black;
      color: gold;
      font-size: 80px;
      padding-top: 240px;
    }

    .option {
      display: block;
      margin: 20px;
      padding: 20px;
      background: #222;
      border: 2px solid white;
      cursor: pointer;
    }

    .option:hover {
      background: #444;
    }
  </style>
</head>

<body>

<h1>🎮 Jeopardy PRO</h1>

<div class="score">
  🟢 P1: <span id="p1">0</span> |
  🔵 P2: <span id="p2">0</span> |
  🟡 P3: <span id="p3">0</span> |
  🔴 P4: <span id="p4">0</span>
</div>

<table id="board"></table>

<!-- 🏆 WIN SCREEN -->
<div id="winScreen"></div>

<script>

let scores = [0,0,0,0];
let current = 0;
let used = 0;

const categories = ["Math","Tarix","Geo","IT","Sport"];

const points = [100,200,300,400,500,600,700,800];

const questions = [
  [
    {q:"2+2?", o:["3","4","5","6"], a:1},
    {q:"5×5?", o:["20","25","30","15"], a:1},
    {q:"10-3?", o:["6","7","8","9"], a:1},
    {q:"12/4?", o:["2","3","4","6"], a:1},
    {q:"9+1?", o:["10","11","12","13"], a:0},
    {q:"6+6?", o:["10","12","14","16"], a:1},
    {q:"8×2?", o:["14","16","18","20"], a:1},
    {q:"20/5?", o:["2","3","4","5"], a:2}
  ],
  [
    {q:"Toshkent?", o:["Buxoro","Toshkent","Xiva","Farg'ona"], a:1},
    {q:"1991?", o:["urush","mustaqillik","inqilob","davlat"], a:1},
    {q:"Amir Temur?", o:["olim","sarkarda","shoir","dehqon"], a:1},
    {q:"Prezident?", o:["Karimov","Obama","Putin","Erdogan"], a:0},
    {q:"1945?", o:["urush","tinchlik","yil","davlat"], a:0},
    {q:"Bayroq rangi?", o:["ko'k","qizil","yashil","oq"], a:0},
    {q:"O'zbekiston?", o:["davlat","shahar","qishloq","daryo"], a:0},
    {q:"Temur?", o:["sarkarda","olim","artist","shoir"], a:0}
  ],
  [
    {q:"Eng katta okean?", o:["Atlantika","Tinch","Hind","Shimoliy"], a:1},
    {q:"Qit'a?", o:["5","6","7","8"], a:2},
    {q:"Nil?", o:["daryo","tog'","ko'l","shahar"], a:0},
    {q:"Yer?", o:["dumaloq","tekis","kvadrat","uchburchak"], a:0},
    {q:"Sovuq?", o:["Antarktida","Afrika","Osiyo","Yevropa"], a:0},
    {q:"Dunyo?", o:["planeta","yulduz","oy","quyosh"], a:0},
    {q:"Qit'a soni?", o:["7","5","6","4"], a:0},
    {q:"Daryo?", o:["Nil","Amu","Sirdaryo","Volga"], a:0}
  ],
  [
    {q:"Apple?", o:["olma","banan","uzum","anor"], a:0},
    {q:"Book?", o:["kitob","qalam","daftar","stol"], a:0},
    {q:"Hello?", o:["salom","xayr","rahmat","kechirasiz"], a:0},
    {q:"Go past?", o:["went","goes","gone","going"], a:0},
    {q:"Dog?", o:["it","mushuk","ot","qush"], a:0},
    {q:"Sun?", o:["quyosh","oy","yulduz","yer"], a:0},
    {q:"Water?", o:["suv","olov","havo","tuproq"], a:0},
    {q:"Ice?", o:["muz","suv","olov","tosh"], a:0}
  ],
  [
    {q:"Futbol?", o:["11","10","9","12"], a:0},
    {q:"Messi?", o:["Argentina","Braziliya","Fransiya","Portugal"], a:0},
    {q:"Ronaldo?", o:["Portugal","Ispaniya","Italiya","Germaniya"], a:0},
    {q:"NBA?", o:["basketbol","futbol","tennis","hokkey"], a:0},
    {q:"Olimpiada?", o:["4","2","1","5"], a:0},
    {q:"Gepard?", o:["tez","sekin","katta","kichik"], a:0},
    {q:"Sport?", o:["harakat","uyqu","ovqat","kitob"], a:0},
    {q:"O'yin?", o:["fun","work","sleep","eat"], a:0}
  ]
];

function createBoard(){
  let t = document.getElementById("board");

  let h = "<tr>";
  for(let c of categories){
    h += "<th>"+c+"</th>";
  }
  h += "</tr>";
  t.innerHTML += h;

  for(let i=0;i<8;i++){
    let r = "<tr>";
    for(let j=0;j<5;j++){
      r += `<td onclick="openQ(${j},${i},this)">${points[i]}</td>`;
    }
    r += "</tr>";
    t.innerHTML += r;
  }
}

function openQ(cat, idx, cell){

  let q = questions[cat][idx];

  let box = document.createElement("div");
  box.style.position = "fixed";
  box.style.top = "20%";
  box.style.left = "30%";
  box.style.width = "40%";
  box.style.background = "#222";
  box.style.padding = "20px";
  box.style.border = "2px solid white";

  box.innerHTML = `<h3>${q.q}</h3>`;

  q.o.forEach((opt, i)=>{
    let btn = document.createElement("div");
    btn.className = "option";
    btn.innerText = String.fromCharCode(65+i) + ") " + opt;

    btn.onclick = ()=>{
      if(i === q.a){
        scores[current] += points[idx];
      } else {
        scores[current] -= points[idx];
      }

      current = (current+1)%4;
      update();

      cell.style.background="gray";
      cell.onclick=null;

      document.body.removeChild(box);

      used++;
      if(used === 40){
        showWinner();
      }
    };

    box.appendChild(btn);
  });

  document.body.appendChild(box);
}

function update(){
  document.getElementById("p1").innerText = scores[0];
  document.getElementById("p2").innerText = scores[1];
  document.getElementById("p3").innerText = scores[2];
  document.getElementById("p4").innerText = scores[3];
}

function showWinner(){
  let max = Math.max(...scores);
  let winner = scores.indexOf(max) + 1;

  let win = document.getElementById("winScreen");
  win.style.display = "block";
  win.innerHTML = "🏆 WINNER: PLAYER " + winner + "<br><br>Score: " + max;
}

createBoard();
update();

</script>

</body>
</html>
