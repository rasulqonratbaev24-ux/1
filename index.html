<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jeopardy PRO</title>

<style>
body{
  font-family:Arial;
  text-align:center;
  background:#111;
  color:white;
}

/* SCORE PANEL */
.score{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin:15px;
}

.team{
  padding:20px 30px;
  background:#222;
  border:4px solid white;
  border-radius:20px;
  font-size:36px;
  transition:0.3s;
}

.active{
  background:green;
  transform:scale(1.1);
  box-shadow:0 0 24px lime;
}

/* BOARD */
table{
  margin:auto;
  border-collapse:collapse;
}

th,td{
  width:240px;
  height:120px;
  border:4px solid white;
  cursor:pointer;
}

th{background:darkred;}
td{background:blue;}

/* MODAL */
.modal{
  position:fixed;
  top:20%;
  left:50%;
  transform:translateX(-50%);
  width:60%;
  background:#222;
  padding:40px;
  border:4px solid white;
  z-index:999;
}

.option{
  margin:20px;
  padding:20px;
  background:#333;
  border:1px solid white;
  cursor:pointer;
}

.option:hover{background:#555;}

/* ANIMATION */
.pop{
  animation:pop 0.4s ease;
}

@keyframes pop{
  0%{transform:scale(1);}
  50%{transform:scale(1.3);}
  100%{transform:scale(1);}
}

/* WIN */
#win{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:black;
  color:gold;
  font-size:80px;
  padding-top:240px;
}
</style>
</head>

<body>
