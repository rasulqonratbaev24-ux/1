<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>JEOPARDY PRO FINAL</title>

<style>
body{background:#111;color:white;font-family:Arial;text-align:center;}

.score{display:flex;justify-content:center;gap:10px;margin:10px;flex-wrap:wrap;}

.team{padding:20px;border:4px solid white;border-radius:8px;}

table{margin:auto;border-collapse:collapse;}

td,th{
width:220px;height:120px;
border:4px solid white;
cursor:pointer;
}

th{background:red;}
td{background:blue;}

.modal{
position:fixed;
top:30%;left:50%;
transform:translate(-50%,-50%);
background:#222;
padding:40px;
border:4px solid white;
width:60%;
z-index:999;
}

.option{
margin:16px;
padding:20px;
background:#333;
cursor:pointer;
}

.option:hover{background:#555;}

#bonusBox{
display:none;
position:fixed;
top:50%;left:50%;
transform:translate(-50%,-50%);
background:gold;
color:black;
padding:60px;
font-size:56px;
border:6px solid white;
z-index:9999;
}
input{width:120px;text-align:center;}
</style>
</head>

<body>

<h2>🎮 JEOPARDY PRO FINAL</h2>

<div class="score">
<div>T1 <input onchange="edit(0,this.value)"></div>
<div>T2 <input onchange="edit(1,this.value)"></div>
<div>T3 <input onchange="edit(2,this.value)"></div>
<div>T4 <input onchange="edit(3,this.value)"></div>
</div>

<table id="board"></table>

<div id="bonusBox"></div>

<script>

let pts=[100,200,300,400,500,600,700,800];
let cats=["A","B","C","D","E"];
let current=0;

/* 40 SAVOL */
const q = [

/* MATH */

],

/* TARIX */
[

{q:"1945?",o:["Urush","Boshlanish","Davlat","Tinchlik"],a:0},
{q:"Bayroq?",o:["Ko‘k","Qizil","Sariq","Qora"],a:0},
{q:"Temur joy?",o:["Shahrisabz","Xiva","Nukus","Farg‘ona"],a:0},

],

/* GEO */
[

{q:"Sovuq?",o:["Antarktida","Afrika","Osiyo","Yevropa"],a:0},
{q:"Dunyo?",o:["Planet","Yulduz","Oy","Quyosh"],a:0},

{q:"Daryo?",o:["Nil","Amu","Sirdaryo","Volga"],a:0}
],

/* ENGLISH */
[
{q:"Hello?",o:["Salom","Xayr","Rahmat","Uzr"],a:0},
{q:"Book?",o:["Kitob","Qalam","Stol","Telefon"],a:0},

{q:"Go past?",o:["Went","Go","Gone","Going"],a:0},
{q:"Dog?",o:["It","Mushuk","Ot","Qush"],a:0},
{q:"Water?",o:["Suv","Olov","Havo","Tuproq"],a:0},
{q:"Sun?",o:["Quyosh","Oy","Yulduz","Yer"],a:0},
{q:"Ice?",o:["Muz","Suv","Tosh","Olov"],a:0}
],

/* SPORT */
[
{q:"11 o‘yinchi?",o:["Futbol","Basketbol","Tennis","Hokkey"],a:0},
{q:"Messi?",o:["Argentina","Braziliya","Fransiya","Italiya"],a:0},
{q:"Ronaldo?",o:["Portugal","Ispaniya","Germaniya","Fransiya"],a:0},
{q:"NBA?",o:["Basketbol","Futbol","Tennis","Hokkey"],a:0},

{q:"Sport?",o:["Harakat","Uyqu","Ovqat","Kitob"],a:0},
{q:"O‘yin?",o:["Fun","Work","Sleep","Eat"],a:0}
]

];

/* 4 BONUS */
let bonus=[];
while(bonus.length<4){
let r=Math.floor(Math.random()*40);
if(!bonus.includes(r)) bonus.push(r);
}

function board(){
let t=document.getElementById("board");

let h="<tr>";
cats.forEach(c=>h+="<th>"+c+"</th>");
h+="</tr>";
t.innerHTML=h;

for(let i=0;i<8;i++){
let r="<tr>";
for(let j=0;j<5;j++){
let id=i*5+j;
r+=`<td onclick="openQ(${j},${i},this,${id})">${pts[i]}</td>`;
}
r+="</tr>";
t.innerHTML+=r;
}
}

function showBonus(text){
let b=document.getElementById("bonusBox");
b.innerText=text;
b.style.display="block";
setTimeout(()=>b.style.display="none",1500);
}

function openQ(c,i,cell,id){

/* BONUS */
if(bonus.includes(id)){

let type=Math.floor(Math.random()*4);

if(type===0) showBonus("⚡ 2X ");
if(type===1) showBonus("🔁 SWAP ");
if(type===2) showBonus("🦹 STEAL ");
if(type===3) showBonus("💰 +1000 ");

cell.style.background="gold";
cell.innerText="🎁";
return;
}

/* QUESTION */
let qq=q[c][i];

let div=document.createElement("div");
div.className="modal";
div.innerHTML="<h3>"+qq.q+"</h3>";

qq.o.forEach((o,x)=>{
let b=document.createElement("div");
b.className="option";
b.innerText=o;

b.onclick=()=>{
alert(x===qq.a?"✔ CORRECT":"❌ ERROR");
cell.style.background="gray";
cell.onclick=null;
document.body.removeChild(div);
};

div.appendChild(b);
});

document.body.appendChild(div);
}

board();

</script>

</body>
</html>
